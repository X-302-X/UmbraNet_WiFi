name: Build UmbraNet WiFi

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Test DPI model
        run: cargo test --locked --manifest-path core/dpi/Cargo.toml

      - name: Check WinDivert files
        shell: pwsh
        run: |
          $driver = 'core/dpi/driver'
          $expected = @{
            'WinDivert.dll' = 'c1e060ee19444a259b2162f8af0f3fe8c4428a1c6f694dce20de194ac8d7d9a2'
            'WinDivert64.sys' = '8da085332782708d8767bcace5327a6ec7283c17cfb85e40b03cd2323a90ddc2'
          }
          foreach ($file in $expected.Keys) {
            $actual = (Get-FileHash "$driver/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$file]) { throw "Incorrect WinDivert file: $file" }
          }
          Get-AuthenticodeSignature "$driver/WinDivert64.sys" | Format-List Status, StatusMessage, SignerCertificate

      - name: Build Windows installer
        run: npx --yes --package=@tauri-apps/cli@2.12.4 tauri build --target x86_64-pc-windows-msvc --bundles nsis -- --locked

      - name: Test installer layout and data safety
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe')
          if ($files.Count -ne 1) { throw "Expected exactly one installer, found $($files.Count)" }
          & ./src-tauri/windows/smoke-installer.ps1 -Installer $files[0].FullName

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: UmbraNet_WiFi-Windows-Setup
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
