name: Build UmbraNet WiFi

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build transparent window
        run: npx --yes --package=@tauri-apps/cli@2.12.4 tauri build --target x86_64-pc-windows-msvc --no-bundle -- --locked

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: UmbraNet_WiFi-Windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/umbranet-wifi.exe
          if-no-files-found: error
          retention-days: 7
